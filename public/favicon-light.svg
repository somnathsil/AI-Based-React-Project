<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="CGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- "P" in blue (darker for light backgrounds, uppercase) -->
  <text x="6" y="48" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#0284c7">P</text>
  
  <!-- "C" in gradient (uppercase) -->
  <text x="34" y="48" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="url(#CGradient)">C</text>
</svg>
